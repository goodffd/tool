<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正在打开得到APP...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #FF6B6B, #ee5a24);
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF6B6B, #ee5a24);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            border: none;
            cursor: pointer;
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }
        .fallback {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FF6B6B;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 加载中 -->
        <div id="loading">
            <div class="spinner"></div>
            <h1>正在打开得到APP...</h1>
            <p>请稍候，正在尝试唤起得到APP</p>
        </div>
        
        <!-- 唤起失败提示 -->
        <div id="fallback" class="fallback hidden">
            <div class="logo">📚</div>
            <h1>打开失败</h1>
            <p>未能自动唤起得到APP，请手动选择打开方式</p>
            <a id="scheme-link" class="btn" href="#">在得到APP中打开</a>
            <a id="web-link" class="btn btn-secondary" href="#">在网页中查看</a>
        </div>
    </div>

    <script>
        // 获取URL参数
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }
        
        // 构造scheme链接
        const articleId = getParam('id');
        const ptype = getParam('type') || '65';
        
        const schemeUrl = `igetapp://article/video/playback?id=${articleId}&type=${ptype}&articleId=${articleId}&articleType=${ptype}&autoPlay=true`;
        const webUrl = `https://www.dedao.cn/share/course/article?id=${articleId}`;
        
        // 设置备用链接
        document.getElementById('scheme-link').href = schemeUrl;
        document.getElementById('web-link').href = webUrl;
        
        // 自动唤起APP
        function openApp() {
            // 尝试scheme唤起
            window.location.href = schemeUrl;
            
            // 2秒后检查是否唤起成功
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('fallback').classList.remove('hidden');
            }, 2000);
        }
        
        // 页面加载后立即尝试唤起
        window.onload = function() {
            // 微信环境特殊处理
            const ua = navigator.userAgent.toLowerCase();
            const isWechat = ua.indexOf('micromessenger') !== -1;
            
            if (isWechat) {
                // 微信内显示引导
                document.querySelector('#loading h1').textContent = '请点击右上角...';
                document.querySelector('#loading p').textContent = '选择"在浏览器打开"以唤起得到APP';
                document.getElementById('fallback').classList.remove('hidden');
            } else {
                // 非微信环境直接尝试唤起
                openApp();
            }
        };
    </script>
</body>
</html>
